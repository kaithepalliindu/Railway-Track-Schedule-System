<!DOCTYPE html>
<html>
<head>
    <title>Railway Train Schedule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🚆 Railway Train Schedule System</h1>
<button onclick="loadTrains()">Load Train Schedule</button>

<table>
    <thead>
        <tr>
            <th>Train Name</th>
            <th>Train No</th>
            <th>From</th>
            <th>To</th>
            <th>Seats Available</th>
            <th>Arrival</th>
            <th>Departure</th>
        </tr>
    </thead>
    <tbody id="trainTable"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
